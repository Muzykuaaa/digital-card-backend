<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Илья — Backend TypeScript Developer</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #5f6368;
      --line: #e3e3e3;
      --card: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px 96px; }

    /* Header */
    .head { margin-bottom: 24px; }
    .head h1 {
      font-size: 34px; font-weight: 400; letter-spacing: -0.5px; margin-bottom: 4px;
    }
    .head .role {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; color: var(--muted); letter-spacing: 0.4px;
      margin-bottom: 12px;
    }
    .contacts { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    .contacts a {
      color: var(--text); text-decoration: none;
      border-bottom: 1px solid var(--line);
      margin-right: 18px; padding-bottom: 1px;
    }
    .contacts a:hover { border-bottom-color: var(--text); }

    .intro {
      font-size: 17px; color: var(--text);
      padding: 24px 0; border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); margin-bottom: 48px;
    }

    /* Section headings */
    h2 {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-bottom: 20px;
    }
    section { margin-bottom: 56px; }

    /* Skills — plain grouped list */
    .skill-cat { margin-bottom: 14px; font-size: 16px; }
    .skill-cat b {
      font-weight: 400; color: var(--muted); font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13.5px; margin-right: 6px;
    }

    /* Experience */
    .job { margin-bottom: 32px; }
    .job:last-child { margin-bottom: 0; }
    .job .pos { font-size: 18px; }
    .job .org { font-size: 15px; color: var(--muted); margin: 2px 0 0; }
    .job .per { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
    .job ul { list-style: none; }
    .job li { font-size: 15.5px; color: var(--text); padding-left: 20px; position: relative; margin-bottom: 5px; }
    .job li::before { content: '·'; position: absolute; left: 4px; color: var(--muted); }

    /* Projects */
    .proj { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .proj:first-of-type { border-top: 1px solid var(--line); }
    .proj:last-of-type { margin-bottom: 0; }
    .proj a {
      font-size: 17px; color: var(--text); text-decoration: none;
      font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600;
    }
    .proj a:hover { text-decoration: underline; }
    .proj p { font-size: 15px; color: var(--muted); margin: 6px 0 8px; }
    .proj .stack {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12.5px; color: var(--muted);
    }
    .proj .stack i { font-style: normal; }
    .proj .stack i:not(:last-child)::after { content: ' ·'; }

    /* Photo */
    .photo {
      width: 96px; height: 96px; border-radius: 50%;
      border: 1px solid var(--line);
      float: right; margin-left: 24px; overflow: hidden;
      background: #efefef;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .foot {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12.5px; color: var(--muted);
      border-top: 1px solid var(--line); padding-top: 20px;
    }
    .foot a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
    .foot a:hover { border-bottom-color: var(--text); }

    .error { color: #a33; font-size: 15px; padding: 24px 0; }

    @media (max-width: 600px) {
      .wrap { padding: 40px 20px 72px; }
      .head h1 { font-size: 28px; }
      .photo { float: none; margin: 0 0 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="root"></div>
    <div class="foot">
      Данные получены через GraphQL API · <a href="/graphql" target="_blank">Apollo Sandbox</a>
    </div>
  </div>

  <script>
    const QUERY = `
      query {
        profile {
          name
          description
          links { label url }
          skills { name category }
          experience { company position period achievements }
          projects { name description url techStack }
        }
      }
    `;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function renderProfile(p) {
      const root = document.getElementById('root');
      const parts = [];

      parts.push(`
        <div class="head">
          <div class="photo"><img src="/photo.jpg" alt="${esc(p.name)}" onerror="this.parentNode.style.display='none'" /></div>
          <h1>${esc(p.name)}</h1>
          <div class="role">Backend TypeScript Developer</div>
          <div class="contacts">
            ${p.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}
          </div>
        </div>`);

      parts.push(`<div class="intro">${esc(p.description)}</div>`);

      if (p.skills.length) {
        const byCat = new Map();
        for (const s of p.skills) {
          if (!byCat.has(s.category)) byCat.set(s.category, []);
          byCat.get(s.category).push(s.name);
        }
        parts.push(`
          <section>
            <h2>Навыки</h2>
            ${[...byCat].map(([cat, names]) =>
              `<div class="skill-cat"><b>${esc(cat)}:</b> ${names.map(esc).join(', ')}</div>`).join('')}
          </section>`);
      }

      if (p.experience.length) {
        parts.push(`
          <section>
            <h2>Опыт работы</h2>
            ${p.experience.map((j) => `
              <div class="job">
                <div class="pos">${esc(j.position)}</div>
                <div class="org">${esc(j.company)}</div>
                <div class="per">${esc(j.period)}</div>
                <ul>${j.achievements.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
              </div>`).join('')}
          </section>`);
      }

      if (p.projects.length) {
        parts.push(`
          <section>
            <h2>Проекты</h2>
            ${p.projects.map((pr) => `
              <div class="proj">
                <a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.name)}</a>
                <p>${esc(pr.description)}</p>
                <div class="stack">${pr.techStack.map((t) => `<i>${esc(t)}</i>`).join('')}</div>
              </div>`).join('')}
          </section>`);
      }

      root.innerHTML = parts.join('');
    }

    async function load() {
      try {
        const res = await fetch('/graphql', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ query: QUERY }),
        });
        const json = await res.json();
        if (json.errors || !json.data.profile) throw new Error(json.errors?.[0]?.message || 'профиль пуст');
        renderProfile(json.data.profile);
      } catch (e) {
        document.getElementById('root').innerHTML =
          `<div class="error">Не удалось загрузить профиль: ${esc(e.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
